

    <style>
    
        :root {
            --gold: #FFD700; 
            --rose-gold: #ff758c; 
            --dark-bg: #030002; 
            --glass-bg: rgba(30, 10, 15, 0.7); 
            --glass-border: rgba(255, 117, 140, 0.7);
            --text-light: #ffffff;
            --neon-glow: 0 0 15px rgba(255, 117, 140, 0.7), 0 0 30px rgba(255, 215, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            overflow: hidden;
        }

       
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

      
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1.05);
        }

        .screen.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        .screen.fade-out-up {
            opacity: 0;
            transform: translateY(-50px) scale(1.1);
            filter: blur(10px);
        }

        
        .lock-container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: var(--neon-glow), inset 0 0 30px rgba(255, 117, 140, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lock-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            fill: none;
            stroke: var(--gold); 
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 15px var(--gold));
            transition: transform 0.5s ease;
        }

        .lock-icon.unlocked path:nth-child(2) {
            transform: translateY(-5px) translateX(5px) rotate(15deg);
            transform-origin: center;
        }

        .lock-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--gold), var(--rose-gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 3px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        .lock-subtitle {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .passcode-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            height: 20px;
            width: 100%;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--rose-gold);
            background: transparent;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }

        .dot.filled {
            background: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold);
            transform: scale(1.3);
        }

        .dot.error {
            border-color: #ff1100;
            background: #ff1100;
            box-shadow: 0 0 20px #ff1100;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            justify-items: center;
            width: 100%;
        }

        .key {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255, 117, 140, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1.8rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.2);
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .key:hover {
            background: rgba(255, 117, 140, 0.3);
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.8);
            border-color: var(--gold);
            color: var(--gold);
        }

        .key:active {
            transform: scale(0.85);
            background: var(--rose-gold);
            color: white;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

       
        .heart-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 10000;
            animation: explodeHeart 2s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes explodeHeart {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(var(--scale)) rotate(var(--rot));
                opacity: 0;
            }
        }

        
        .dashboard-container {
            width: 95%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(to right, var(--gold), #ffffff, var(--rose-gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); 
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .time-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .time-box {
            background: var(--glass-bg);
            border: 2px solid var(--rose-gold);
            backdrop-filter: blur(20px);
            padding: 30px 25px;
            border-radius: 20px;
            min-width: 150px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 117, 140, 0.4), inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .time-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            box-shadow: 0 0 15px var(--gold);
        }

        .time-number {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem; 
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px var(--rose-gold), 0 0 20px var(--rose-gold), 0 0 40px var(--gold);
            line-height: 1;
            margin-bottom: 10px;
        }

        .time-label {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .nav-buttons {
            display: flex;
            gap: 30px;
            margin-top: 30px;
        }

        .premium-btn {
            background: rgba(255, 117, 140, 0.1);
            color: #ffffff;
            border: 2px solid var(--rose-gold);
            padding: 18px 50px;
            border-radius: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease, transform 0.1s ease;
            box-shadow: 0 0 20px rgba(255, 117, 140, 0.3);
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .premium-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: linear-gradient(45deg, var(--rose-gold), var(--gold));
            transition: all 0.4s ease;
            z-index: -1;
        }

        .premium-btn:hover::before {
            width: 100%;
        }

        .premium-btn:hover {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            border-color: var(--gold);
            color: #000; 
            text-shadow: none;
        }

        .premium-btn:active {
            transform: scale(0.92);
        }

       
        .scene {
            width: 100%;
            height: 65vh;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel {
            width: 280px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s; 
            cursor: grab;
        }

        .carousel:active {
            cursor: grabbing;
        }

        .carousel-cell {
            position: absolute;
            width: 280px;
            height: 400px;
            left: 10px;
            top: 10px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--gold);
            box-shadow: 0 0 30px var(--gold), inset 0 0 20px rgba(0,0,0,0.8);
            transition: opacity 0.3s;
            user-select: none;
            -webkit-user-drag: none;
            background-color: #000;
        }

        .carousel-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; 
            opacity: 0.9; 
            transition: opacity 0.3s;
        }
        
        .carousel-cell:hover img {
            opacity: 1;
        }

        .gallery-title {
            position: absolute;
            top: 8%;
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px var(--rose-gold), 0 0 40px var(--gold);
            letter-spacing: 8px;
        }

        .btn-back {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .btn-back:active {
            transform: translateX(-50%) scale(0.95);
        }

        
        .letter-container {
            width: 90%;
            max-width: 800px;
            background: rgba(20, 5, 10, 0.85);
            border: 2px solid var(--gold); 
            backdrop-filter: blur(30px);
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(255, 117, 140, 0.2);
            position: relative;
        }

        .letter-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            line-height: 2.2;
            color: #ffffff; 
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5); 
            font-weight: 400;
            min-height: 250px;
        }

        .signature {
            font-family: 'Alex Brush', cursive;
            font-size: 4.5rem;
            color: var(--gold);
            text-align: right;
            margin-top: 40px;
            opacity: 0;
            transition: opacity 2s ease;
            text-shadow: 0 0 20px var(--gold), 0 0 40px var(--rose-gold); 
        }

        .signature.show {
            opacity: 1;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: var(--gold);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 10px var(--gold);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

      
        @media (max-width: 768px) {
            .lock-container { min-height: 450px; padding: 40px 20px; }
            .lock-title { font-size: 1.8rem; }
            .key { width: 60px; height: 60px; font-size: 1.5rem; }
            
            .main-title { font-size: 2.5rem; margin-top: 20px; }
            .time-box { min-width: 110px; padding: 20px 10px; }
            .time-number { font-size: 2.8rem; }
            .time-label { font-size: 0.7rem; }
            .nav-buttons { flex-direction: column; width: 85%; gap: 15px;}
            .premium-btn { width: 100%; padding: 15px 20px; font-size: 0.9rem;}
            
            .gallery-title { font-size: 2rem; top: 5%;}
            .carousel { width: 220px; height: 320px; }
            .carousel-cell { width: 220px; height: 320px; }
            
            .letter-container { padding: 40px 25px; }
            .letter-text { font-size: 1.1rem; line-height: 1.8; }
            .signature { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div id="screen-lock" class="screen active">

                <path d="M7 11V7C7 4.23858 9.23858 2 12 2C14.7614 2 17 4.23858 17 7V11" />
                <circle cx="12" cy="16" r="1" fill="currentColor"/>
                <path d="M12 16V18" />
            </svg>
            
            <h1 class="lock-title">FELIZ ANIVERSARIO</h1>

            <div class="passcode-display" id="dots-container">
                <div class="dot"></div>

    <div id="screen-dashboard" class="screen">
        <div class="dashboard-container">
            <h1 class="main-title">Nuestro Tiempo Juntos</h1>
            
            <div class="time-wrapper">
                <div class="time-box">
                    <div class="time-number" id="t-anos">0</div>

                <div class="time-box">

                    <div class="time-number" id="t-dias">0</div>

                </div>
                <div class="time-box">
                    <div class="time-number" id="t-horas">0</div>
                    <div class="time-label">Horas</div>
                </div>
                <div class="time-box">
                    <div class="time-number" id="t-minutos">0</div>
                    <div class="time-label">Min</div>
                </div>
                <div class="time-box">
                    <div class="time-number" id="t-segundos">0</div>

            <div class="nav-buttons">

                <div class="carousel-cell"><img src="4.jpg" alt="Foto 4"></div>

                <span id="typed-text"></span><span class="cursor" id="cursor"></span>

    <script>
        
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, {passive: true});

        class Particle {
            constructor(x, y, dx, dy, size, color) {
                this.x = x; this.y = y;
                this.dx = dx; this.dy = dy;
                this.size = size; this.color = color;
                this.baseX = x; this.baseY = y;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 20; 
                ctx.shadowColor = this.color;
            }
            update() {
                if(this.x > canvas.width || this.x < 0) this.dx = -this.dx;
                if(this.y > canvas.height || this.y < 0) this.dy = -this.dy;

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    const directionX = forceDirectionX * force * 5;
                    const directionY = forceDirectionY * force * 5;
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if(this.x !== this.baseX) this.x += this.dx;
                    if(this.y !== this.baseY) this.y += this.dy;
                }
                this.x += this.dx;
                this.y += this.dy;
                this.draw();
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = (canvas.width * canvas.height) / 2000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 3) + 0.5; 
                let x = Math.random() * innerWidth;
                let y = Math.random() * innerHeight;
                let dx = (Math.random() - 0.5) * 0.5;
                let dy = (Math.random() - 0.5) * 0.5;
                let colors = ['#FFD700', '#ff758c', '#ffffff', '#ffb6c1'];
                let color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, dx, dy, size, color));
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
        }
        animateParticles();

        
        function triggerHeartExplosion() {
            const colors = ['#FFD700', '#ff758c', '#ffffff', '#ff0055'];
            const numberOfHearts = 100; 

            for (let i = 0; i < numberOfHearts; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart-burst';
                
                let angle = Math.random() * Math.PI * 2;
                let distance = Math.random() * (window.innerWidth / 1.1) + 50;
                
                heart.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                heart.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                heart.style.setProperty('--rot', `${Math.random() * 360}deg`);
                heart.style.setProperty('--scale', Math.random() * 2.5 + 0.5); 
                heart.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
                
                heart.innerHTML = `<svg viewBox="0 0 24 24" style="width:100%; height:100%; fill:var(--color); filter:drop-shadow(0 0 15px var(--color));"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 2000);
            }
        }

   
        const TARGET_PASS = "240419";
        let currentPass = "";
        const dots = document.querySelectorAll('.dot');
        const lockBox = document.getElementById('lock-box');
        const lockSvg = document.getElementById('lock-svg');

        function updateDots() {
            dots.forEach((dot, index) => {
                if(index < currentPass.length) {
                    dot.classList.add('filled');
                    dot.classList.remove('error');
                } else {
                    dot.classList.remove('filled');
                    dot.classList.remove('error');
                }
            });
        }

        function pressKey(num) {
            if (currentPass.length < 6) {
                currentPass += num;
                updateDots();
                
                if (currentPass.length === 6) {
                    setTimeout(verifyPasscode, 200);
                }
            }
        }

        function deleteKey() {
            currentPass = currentPass.slice(0, -1);
            updateDots();
        }

        function clearPasscode() {
            currentPass = "";
            updateDots();
        }

        function verifyPasscode() {
            if (currentPass === TARGET_PASS) {
                lockSvg.classList.add('unlocked');
                
                triggerHeartExplosion();
                
                particles.forEach(p => { p.dx *= 15; p.dy *= 15; }); 
                
                setTimeout(() => {
                    document.getElementById('screen-lock').classList.add('fade-out-up');
                    setTimeout(() => {
                        document.getElementById('screen-lock').classList.remove('active');
                        document.getElementById('screen-dashboard').classList.add('active');
                        initParticles(); 
                    }, 1000);
                }, 800);
            } else {
                lockBox.classList.add('shake');
                dots.forEach(dot => dot.classList.add('error'));
                setTimeout(() => {
                    lockBox.classList.remove('shake');
                    clearPasscode();
                }, 500);
            }
        }

   
        function navTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            if(screenId === 'screen-letter') {
                resetTypewriter();
                setTimeout(startTypewriter, 800);
            }
        }

     
        function updateCounter() {
            const startDate = new Date('2019-04-24T14:32:16');
            const now = new Date();
            
            if (now < startDate) return;

            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            let hours = now.getHours() - startDate.getHours();
            let minutes = now.getMinutes() - startDate.getMinutes();
            let seconds = now.getSeconds() - startDate.getSeconds();

            if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) {
                months--;
                let prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('t-anos').innerText = years;
            document.getElementById('t-meses').innerText = months;
            document.getElementById('t-dias').innerText = days;
            document.getElementById('t-horas').innerText = hours;
            document.getElementById('t-minutos').innerText = minutes;
            document.getElementById('t-segundos').innerText = seconds;
        }
        setInterval(updateCounter, 1000);
        updateCounter();

       
        const carousel = document.getElementById('carousel3d');
        const cells = carousel.querySelectorAll('.carousel-cell');
        const cellCount = cells.length;
        const radius = Math.round( ( 280 / 2 ) / Math.tan( Math.PI / cellCount ) ) + 50; 
        let currentAngle = 0;
        let theta = 360 / cellCount;

        for (let i = 0; i < cellCount; i++) {
            let cellAngle = theta * i;
            cells[i].style.transform = `rotateY(${cellAngle}deg) translateZ(${radius}px)`;
        }

        let isDragging = false;
        let startX, currentX;
        let dragAngleOffset = 0;

        function startDrag(e) {
            isDragging = true;
            startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            carousel.style.transition = 'none'; 
        }

        function drag(e) {
            if (!isDragging) return;
            currentX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            let diffX = currentX - startX;
            dragAngleOffset = (diffX / window.innerWidth) * 180; 
            carousel.style.transform = `translateZ(${-radius}px) rotateY(${currentAngle + dragAngleOffset}deg)`;
        }

        function endDrag() {
            if(!isDragging) return;
            isDragging = false;
            currentAngle += dragAngleOffset;
            let snapIndex = Math.round(currentAngle / theta);
            currentAngle = snapIndex * theta;
            
            carousel.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
            carousel.style.transform = `translateZ(${-radius}px) rotateY(${currentAngle}deg)`;
            dragAngleOffset = 0;
        }

        document.querySelector('.scene').addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        
        document.querySelector('.scene').addEventListener('touchstart', startDrag, {passive: true});
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('touchend', endDrag);

        carousel.style.transform = `translateZ(${-radius}px) rotateY(0deg)`;

      
        const letterContent = `Hola Amor

Gracias por el tiempo, gracias por cada instante, cada risa y hasta por los silencios que hemos compartido.
Estamos aqui porque Dios ha querido que sea asi, doy gracias a el por eso. Tambien me tome el momento para
Redactar estas palabras y de ante mano te agradezco por el tiempo que dedicaras a leerlo, tal vez no soy
La persona mas detallista que existe pero en estas lineas va reflejado mis sentimientos.
Hay tantos recuerdos de muchos momentos vividos.

Feliz Aniversario.`;

        const typeContainer = document.getElementById('typed-text');
        const signature = document.getElementById('signature');
        let typeIndex = 0;
        let isTyping = false;
        let typeInterval;

        function resetTypewriter() {
            typeContainer.innerHTML = "";
            signature.classList.remove('show');
            typeIndex = 0;
            isTyping = false;
            clearInterval(typeInterval);
        }

        function startTypewriter() {
            if(isTyping) return;
            isTyping = true;
            
            typeInterval = setInterval(() => {
                if (typeIndex < letterContent.length) {
                    let char = letterContent.charAt(typeIndex);
                    if (char === '\n') {
                        typeContainer.innerHTML += '<br>';
                    } else {
                        typeContainer.innerHTML += char;
                    }
                    typeIndex++;
                } else {
                    clearInterval(typeInterval);
                    setTimeout(() => {
                        signature.classList.add('show');
                    }, 500);
                }
            }, 60); 
        }
    </script>
